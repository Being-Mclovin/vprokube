vproapp:
  name: vproapp
  replicas: 1
  image: beingmclovin/vprofileapp
  port: 8080

vprodb:
  name: vprodb
  replicas: 1
  image: beingmclovin/vprofiledb
  port: 3306

memecached:
  name: vpromc
  replicas: 1
  image: memcached
  port: 11211

rabbitmq:
  name: vprormq
  replicas: 1
  image: rabbitmq
  port: 5672

appservice:
  name: vproapp-service
  port: 8080
