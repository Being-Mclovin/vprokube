    app: vproapp

dbservice:
  name: vprodb
  port: 3306
  selector:
    app: vprodb

memecachedservice:  
  name: vprocache01
  port: 11211
  selector:
    app: vpromc

rabbitmqservice:
  name: vpromq01
  port: 5672
  selector:
    app: vprormq

          

